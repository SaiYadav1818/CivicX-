services:
  mysql:
    image: mysql:8.0
    container_name: janseva-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: janseva
      MYSQL_USER: janseva
      MYSQL_PASSWORD: janseva
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ujanseva", "-pjanseva"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: janseva-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: janseva-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: janseva
      RABBITMQ_DEFAULT_PASS: janseva
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
