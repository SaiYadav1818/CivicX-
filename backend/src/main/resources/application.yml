spring:
  application:
    name: janseva-backend
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:janseva}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:janseva}
    password: ${DB_PASSWORD:janseva}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:janseva}
    password: ${RABBITMQ_PASSWORD:janseva}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-at-least-32-byte-secret-key}
    access-token-ttl-minutes: ${JWT_ACCESS_TTL:30}
    refresh-token-ttl-days: ${JWT_REFRESH_TTL:7}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
  rate-limit:
    auth-per-minute: 10
    complaint-per-hour: 20
    image-upload-per-hour: 30
  admin:
    email: ${ADMIN_EMAIL:admin@janseva.local}
    password: ${ADMIN_DEFAULT_PASSWORD:Admin@123}
  storage:
    local-dir: ${STORAGE_DIR:./data/object-storage}
    max-image-size-bytes: ${MAX_IMAGE_SIZE_BYTES:5242880}
    max-images-per-complaint: ${MAX_IMAGES_PER_COMPLAINT:5}

civicx:
  ai:
    enabled: ${CIVICX_AI_ENABLED:true}
    provider: ${CIVICX_AI_PROVIDER:rule-based}
  duplicate:
    enabled: ${CIVICX_DUPLICATE_ENABLED:true}
    location-radius-meters: ${CIVICX_DUP_RADIUS_M:100}
    text-threshold: ${CIVICX_DUP_TEXT_THRESHOLD:0.25}
    image-hash-threshold: ${CIVICX_DUP_IMAGE_HAMMING:10}
    image-embedding-threshold: ${CIVICX_DUP_EMBED_THRESHOLD:0.90}
    duplicate-threshold: ${CIVICX_DUP_SCORE_THRESHOLD:0.55}
    review-threshold: ${CIVICX_DUP_REVIEW_THRESHOLD:0.45}
    weights:
      location: 0.40
      text: 0.30
      image: 0.20
      category: 0.10
  outbox:
    poll-ms: ${CIVICX_OUTBOX_POLL_MS:5000}
    max-attempts: ${CIVICX_OUTBOX_MAX_ATTEMPTS:10}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
